<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Контакты — Название сайта">
    <meta name="keywords" content="контакты, связь, написать нам">
    <meta name="author" content="Ваше имя">

    <meta property="og:title" content="Контакты — Название сайта">
    <meta property="og:description" content="Свяжитесь с нами">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ваш-домен.ru/pages/contact.html">

    <link rel="canonical" href="https://ваш-домен.ru/pages/contact.html">
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">

    <title>Контакты — Название сайта</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="page-hero">
            <div class="container">
                <h1>Контакты</h1>
                <p>Свяжитесь с нами удобным способом</p>
            </div>
        </section>

        <section class="contact-content">
            <div class="container">
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="name">Имя</label>
                        <input type="text" id="name" name="name" placeholder="Ваше имя" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Сообщение</label>
                        <textarea id="message" name="message" rows="6" placeholder="Ваше сообщение..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn--primary">Отправить</button>
                </form>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/components.js"></script>
    <script src="../js/contact.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
